<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="loomisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F5EF"/>
      <stop offset="100%" stop-color="#EEF2F5"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#loomisBg)"/>
  
  <!-- Browser Frame -->
  <g transform="translate(30, 25)">
    <rect width="540" height="310" rx="10" fill="#FFFFFF" stroke="#D9DDE2" stroke-width="1.5"/>
    <!-- Top Bar -->
    <path d="M 0 10 C 0 4.4 4.4 0 10 0 L 530 0 C 535.6 0 540 4.4 540 10 L 540 36 L 0 36 Z" fill="#EEF2F5"/>
    <circle cx="20" cy="18" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="18" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="18" r="5" fill="#27C93F"/>
    
    <!-- URL Bar -->
    <rect x="80" y="8" width="300" height="20" rx="5" fill="#FFFFFF" stroke="#D9DDE2" stroke-width="1"/>
    <text x="95" y="22" font-family="sans-serif" font-size="11" fill="#687386">loomis.prep/dashboard</text>

    <!-- App Content Layout -->
    <!-- Sidebar -->
    <rect x="0" y="36" width="120" height="274" fill="#F8F5EF" stroke="#E2E7ED" stroke-width="1"/>
    <rect x="15" y="55" width="90" height="12" rx="3" fill="#172033"/>
    
    <rect x="15" y="90" width="70" height="8" rx="2" fill="#587A9E"/>
    <rect x="15" y="110" width="80" height="8" rx="2" fill="#94A3B8"/>
    <rect x="15" y="130" width="65" height="8" rx="2" fill="#94A3B8"/>
    <rect x="15" y="150" width="75" height="8" rx="2" fill="#94A3B8"/>

    <!-- Dashboard Main Area -->
    <text x="145" y="68" font-family="serif" font-size="18" font-weight="bold" fill="#172033">Job Readiness Dashboard</text>
    
    <!-- Cards row -->
    <!-- Card 1 -->
    <rect x="145" y="85" width="115" height="70" rx="8" fill="#EEF2F5"/>
    <text x="157" y="105" font-family="sans-serif" font-size="10" fill="#687386">Mock Interviews</text>
    <text x="157" y="130" font-family="sans-serif" font-size="20" font-weight="bold" fill="#172033">84%</text>

    <!-- Card 2 -->
    <rect x="272" y="85" width="115" height="70" rx="8" fill="#EEF2F5"/>
    <text x="284" y="105" font-family="sans-serif" font-size="10" fill="#687386">DSA Solved</text>
    <text x="284" y="130" font-family="sans-serif" font-size="20" font-weight="bold" fill="#587A9E">142/180</text>

    <!-- Card 3 -->
    <rect x="399" y="85" width="115" height="70" rx="8" fill="#172033"/>
    <text x="411" y="105" font-family="sans-serif" font-size="10" fill="#A8BED5">Placement Readiness</text>
    <text x="411" y="130" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Ready</text>

    <!-- Chart / Progress section -->
    <rect x="145" y="170" width="242" height="120" rx="8" fill="#FFFFFF" stroke="#E2E7ED"/>
    <text x="160" y="190" font-family="sans-serif" font-size="11" font-weight="600" fill="#172033">Skill Assessment Trend</text>
    <path d="M 160 260 L 200 240 L 240 248 L 280 215 L 320 225 L 360 195" fill="none" stroke="#587A9E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="360" cy="195" r="4" fill="#172033"/>

    <!-- Practice recommendations -->
    <rect x="399" y="170" width="115" height="120" rx="8" fill="#FFFFFF" stroke="#E2E7ED"/>
    <rect x="411" y="185" width="90" height="8" rx="2" fill="#587A9E"/>
    <rect x="411" y="202" width="75" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="411" y="225" width="90" height="8" rx="2" fill="#172033"/>
    <rect x="411" y="242" width="60" height="6" rx="2" fill="#CBD5E1"/>
  </g>
</svg>
