<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="railBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#railBg)"/>
  
  <g transform="translate(30, 25)">
    <rect width="540" height="310" rx="10" fill="#172033" stroke="#587A9E" stroke-width="1"/>
    <!-- Top Bar -->
    <path d="M 0 10 C 0 4.4 4.4 0 10 0 L 530 0 C 535.6 0 540 4.4 540 10 L 540 36 L 0 36 Z" fill="#0E1726"/>
    <circle cx="20" cy="18" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="18" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="18" r="5" fill="#27C93F"/>
    
    <text x="75" y="22" font-family="sans-serif" font-size="11" fill="#A8BED5">SIH Rail-Nexus • Smart Railway Optimization System</text>

    <!-- Map & Route Visual Grid -->
    <rect x="25" y="55" width="320" height="235" rx="8" fill="#0E1726" stroke="#2D3B54"/>
    
    <!-- Railway Track Network overlay -->
    <path d="M 50 120 C 120 80, 200 180, 310 100" stroke="#587A9E" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
    <path d="M 50 200 C 150 140, 220 230, 310 180" stroke="#38BDF8" stroke-width="2" fill="none"/>
    
    <!-- Nodes -->
    <circle cx="50" cy="120" r="6" fill="#38BDF8"/>
    <circle cx="200" cy="180" r="8" fill="#10B981"/>
    <circle cx="310" cy="100" r="6" fill="#38BDF8"/>
    <circle cx="150" cy="140" r="6" fill="#F59E0B"/>

    <!-- Train live indicator -->
    <rect x="180" y="155" width="40" height="16" rx="4" fill="#38BDF8"/>
    <text x="188" y="167" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0E1726">TRAIN 1</text>

    <!-- Metrics Panel -->
    <rect x="360" y="55" width="155" height="70" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="372" y="75" font-family="sans-serif" font-size="10" fill="#94A3B8">Track Efficiency</text>
    <text x="372" y="100" font-family="sans-serif" font-size="22" font-weight="bold" fill="#38BDF8">96.4%</text>

    <rect x="360" y="138" width="155" height="70" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="372" y="158" font-family="sans-serif" font-size="10" fill="#94A3B8">Delay Reduction</text>
    <text x="372" y="183" font-family="sans-serif" font-size="22" font-weight="bold" fill="#10B981">-34 min</text>

    <rect x="360" y="220" width="155" height="70" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="372" y="240" font-family="sans-serif" font-size="10" fill="#94A3B8">AI Rerouting</text>
    <text x="372" y="265" font-family="sans-serif" font-size="18" font-weight="bold" fill="#F59E0B">Active</text>
  </g>
</svg>
