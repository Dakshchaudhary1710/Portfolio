<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F5EF" />
      <stop offset="50%" stop-color="#EEF2F5" />
      <stop offset="100%" stop-color="#DCE5F2" />
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#587A9E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#DCE5F2" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F7FA" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0E1726" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Radial Glow -->
  <circle cx="320" cy="240" r="220" fill="url(#blueGlow)" />

  <!-- Outer Frame -->
  <rect x="70" y="40" width="460" height="380" rx="16" fill="url(#heroBg)" stroke="#D9DDE2" stroke-width="1.5" filter="url(#softShadow)" />

  <!-- Inner Art Frame / Landscape Illustration -->
  <g transform="translate(100, 70)">
    <rect width="400" height="320" rx="12" fill="url(#cardGrad)" stroke="#E2E7ED" stroke-width="1"/>
    
    <!-- Sun / Minimalist Disc -->
    <circle cx="280" cy="110" r="45" fill="#E8EEF5" />
    
    <!-- Layered Serene Mountains -->
    <path d="M 0,260 Q 90,160 180,220 T 360,170 L 400,190 L 400,320 L 0,320 Z" fill="#DCE5F2" opacity="0.8"/>
    <path d="M 0,280 Q 120,200 240,250 T 400,210 L 400,320 L 0,320 Z" fill="#A8BED5" opacity="0.85"/>
    <path d="M 0,300 Q 80,240 200,280 T 400,230 L 400,320 L 0,320 Z" fill="#587A9E" opacity="0.9"/>
    
    <!-- Subtle Water Reflection Lines -->
    <line x1="40" y1="305" x2="160" y2="305" stroke="#FFFFFF" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <line x1="200" y1="310" x2="320" y2="310" stroke="#FFFFFF" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Floating UI Overlay Card -->
  <g transform="translate(45, 290)" filter="url(#softShadow)">
    <rect width="210" height="110" rx="12" fill="#FFFFFF" stroke="#D9DDE2" stroke-width="1"/>
    <!-- Card header -->
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#EEF2F5"/>
    <path d="M 28 28 L 40 40 M 40 28 L 28 40" stroke="#587A9E" stroke-width="2" stroke-linecap="round" />
    <rect x="64" y="20" width="110" height="10" rx="5" fill="#172033" opacity="0.9"/>
    <rect x="64" y="36" width="80" height="8" rx="4" fill="#687386" opacity="0.6"/>
    
    <!-- Code / Status indicator -->
    <rect x="16" y="68" width="178" height="24" rx="6" fill="#F8F5EF"/>
    <circle cx="28" cy="80" r="4" fill="#10B981"/>
    <rect x="40" y="77" width="90" height="6" rx="3" fill="#687386"/>
  </g>
</svg>
