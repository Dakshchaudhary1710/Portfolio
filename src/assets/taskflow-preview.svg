<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="taskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#0E1726"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#taskBg)"/>
  
  <g transform="translate(30, 25)">
    <rect width="540" height="310" rx="10" fill="#0E1726" stroke="#2D3B54" stroke-width="1.5"/>
    <path d="M 0 10 C 0 4.4 4.4 0 10 0 L 530 0 C 535.6 0 540 4.4 540 10 L 540 36 L 0 36 Z" fill="#172033"/>
    <circle cx="20" cy="18" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="18" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="18" r="5" fill="#27C93F"/>
    
    <text x="75" y="22" font-family="sans-serif" font-size="11" fill="#A8BED5">TaskFlow • Real-Time Workspace</text>

    <!-- Kanban Columns -->
    <!-- Column 1: To Do -->
    <g transform="translate(20, 55)">
      <rect width="150" height="235" rx="8" fill="#172033"/>
      <text x="12" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#94A3B8">To Do (3)</text>
      
      <rect x="10" y="38" width="130" height="55" rx="6" fill="#1E293B"/>
      <rect x="20" y="50" width="80" height="6" rx="2" fill="#E2E8F0"/>
      <rect x="20" y="62" width="50" height="5" rx="2" fill="#64748B"/>
      <rect x="20" y="74" width="35" height="12" rx="4" fill="#3B82F6"/>

      <rect x="10" y="103" width="130" height="55" rx="6" fill="#1E293B"/>
      <rect x="20" y="115" width="90" height="6" rx="2" fill="#E2E8F0"/>
      <rect x="20" y="127" width="60" height="5" rx="2" fill="#64748B"/>
    </g>

    <!-- Column 2: In Progress -->
    <g transform="translate(195, 55)">
      <rect width="150" height="235" rx="8" fill="#172033"/>
      <text x="12" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#38BDF8">In Progress (2)</text>
      
      <rect x="10" y="38" width="130" height="70" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
      <rect x="20" y="50" width="90" height="6" rx="2" fill="#E2E8F0"/>
      <rect x="20" y="62" width="70" height="5" rx="2" fill="#64748B"/>
      <rect x="20" y="76" width="45" height="12" rx="4" fill="#10B981"/>
      <circle cx="120" cy="82" r="8" fill="#587A9E"/>
    </g>

    <!-- Column 3: Completed -->
    <g transform="translate(370, 55)">
      <rect width="150" height="235" rx="8" fill="#172033"/>
      <text x="12" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#10B981">Completed (5)</text>
      
      <rect x="10" y="38" width="130" height="55" rx="6" fill="#1E293B"/>
      <rect x="20" y="50" width="85" height="6" rx="2" fill="#94A3B8"/>
      <rect x="20" y="62" width="40" height="5" rx="2" fill="#64748B"/>

      <rect x="10" y="103" width="130" height="55" rx="6" fill="#1E293B"/>
      <rect x="20" y="115" width="75" height="6" rx="2" fill="#94A3B8"/>
      <rect x="20" y="127" width="55" height="5" rx="2" fill="#64748B"/>
