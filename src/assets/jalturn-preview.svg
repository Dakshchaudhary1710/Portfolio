<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="jalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2F5"/>
      <stop offset="100%" stop-color="#DCE5F2"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#jalBg)"/>
  
  <g transform="translate(30, 25)">
    <rect width="540" height="310" rx="10" fill="#FFFFFF" stroke="#D9DDE2" stroke-width="1.5"/>
    <path d="M 0 10 C 0 4.4 4.4 0 10 0 L 530 0 C 535.6 0 540 4.4 540 10 L 540 36 L 0 36 Z" fill="#EEF2F5"/>
    <circle cx="20" cy="18" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="18" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="18" r="5" fill="#27C93F"/>
    
    <text x="75" y="22" font-family="sans-serif" font-size="11" fill="#587A9E">JalTurn • Smart Water Recycling & Monitoring</text>

    <!-- Water Telemetry Circular Gauge -->
    <g transform="translate(40, 60)">
      <rect width="230" height="230" rx="10" fill="#F8F5EF" stroke="#E2E7ED"/>
      <circle cx="115" cy="105" r="65" fill="none" stroke="#DCE5F2" stroke-width="12"/>
      <path d="M 115 40 A 65 65 0 1 1 55 135" fill="none" stroke="#587A9E" stroke-width="12" stroke-linecap="round"/>
      <text x="115" y="100" font-family="serif" font-size="24" font-weight="bold" fill="#172033" text-anchor="middle">78%</text>
      <text x="115" y="120" font-family="sans-serif" font-size="10" fill="#687386" text-anchor="middle">Water Saved</text>
      <rect x="35" y="185" width="160" height="24" rx="6" fill="#FFFFFF" stroke="#D9DDE2"/>
      <text x="115" y="201" font-family="sans-serif" font-size="10" fill="#587A9E" text-anchor="middle">Flow Rate: 4.2 L/min</text>
    </g>

    <!-- Conservation Analytics -->
    <g transform="translate(290, 60)">
      <rect width="215" height="105" rx="10" fill="#FFFFFF" stroke="#E2E7ED"/>
      <text x="15" y="25" font-family="sans-serif" font-size="11" font-weight="600" fill="#172033">Daily Consumption Trend</text>
      <!-- Bar chart -->
      <rect x="25" y="60" width="16" height="30" rx="3" fill="#DCE5F2"/>
      <rect x="55" y="45" width="16" height="45" rx="3" fill="#DCE5F2"/>
      <rect x="85" y="35" width="16" height="55" rx="3" fill="#587A9E"/>
      <rect x="115" y="50" width="16" height="40" rx="3" fill="#DCE5F2"/>
      <rect x="145" y="65" width="16" height="25" rx="3" fill="#DCE5F2"/>
      <rect x="175" y="40" width="16" height="50" rx="3" fill="#587A9E"/>

      <rect y="125" width="215" height="105" rx="10" fill="#172033"/>
      <text x="15" y="150" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Recycling Status</text>
      <text x="15" y="180" font-family="sans-serif" font-size="20" font-weight="bold" fill="#DCE5F2">1,240 Liters</text>
      <text x="15" y="200" font-family="sans-serif" font-size="10" fill="#A8BED5">Recycled this month</text>
    </g>
  </g>
</svg>
