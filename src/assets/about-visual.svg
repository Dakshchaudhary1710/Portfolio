<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="100%" height="100%">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0F" />
      <stop offset="60%" stop-color="#10101A" />
      <stop offset="100%" stop-color="#16161F" />
    </linearGradient>

    <!-- Screen inner glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07070A" />
      <stop offset="100%" stop-color="#0F0F16" />
    </linearGradient>

    <!-- Subtle accent glow behind screen -->
    <radialGradient id="glowBehind" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#2A2460" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0B0B0F" stop-opacity="0" />
    </radialGradient>

    <!-- Right-panel glow -->
    <radialGradient id="panelGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C1830" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E0E16" stop-opacity="1" />
    </radialGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <!-- Subtle glow filter for accent lines -->
    <filter id="glowLine" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clip path for screen content -->
    <clipPath id="screenClip">
      <rect x="128" y="52" width="234" height="158" rx="3" />
    </clipPath>
  </defs>

  <!-- Outer container -->
  <rect width="560" height="400" rx="18" fill="url(#bg)" stroke="#1E1E2A" stroke-width="1.5" />

  <!-- Background glow behind laptop -->
  <ellipse cx="280" cy="180" rx="210" ry="130" fill="url(#glowBehind)" />

  <!-- === LAPTOP === -->
  <g filter="url(#shadow)">

    <!-- Monitor outer bezel -->
    <rect x="102" y="30" width="286" height="184" rx="10" fill="#101016" stroke="#252535" stroke-width="1.5" />

    <!-- Screen surface -->
    <rect x="110" y="38" width="270" height="168" rx="6" fill="url(#screenGrad)" />

    <!-- Editor chrome bar -->
    <rect x="110" y="38" width="270" height="22" rx="6" fill="#0A0A10" />
    <rect x="110" y="50" width="270" height="10" fill="#0A0A10" />

    <!-- Traffic lights -->
    <circle cx="124" cy="49" r="3.5" fill="#EF4444" opacity="0.85" />
    <circle cx="135" cy="49" r="3.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="146" cy="49" r="3.5" fill="#22C55E" opacity="0.85" />

    <!-- Tab bar -->
    <rect x="156" y="41" width="68" height="16" rx="3" fill="#16161E" stroke="#2A2A38" stroke-width="0.8" />
    <text x="162" y="52" font-family="'SF Mono', 'Fira Code', monospace" font-size="7" fill="#9E9EA7">main.cpp</text>

    <rect x="228" y="41" width="58" height="16" rx="3" fill="#0D0D13" stroke="#1E1E2A" stroke-width="0.8" />
    <text x="234" y="52" font-family="'SF Mono', 'Fira Code', monospace" font-size="7" fill="#4A4A5E">api.js</text>

    <!-- === CODE EDITOR CONTENT === -->
    <g clip-path="url(#screenClip)">

      <!-- Left gutter / line numbers -->
      <rect x="110" y="60" width="20" height="150" fill="#09090E" />
      <text x="116" y="75" font-family="monospace" font-size="7" fill="#2E2E42" text-anchor="middle">1</text>
      <text x="116" y="85" font-family="monospace" font-size="7" fill="#2E2E42" text-anchor="middle">2</text>
      <text x="116" y="95" font-family="monospace" font-size="7" fill="#2E2E42" text-anchor="middle">3</text>
      <text x="116" y="105" font-family="monospace" font-size="7" fill="#2E2E42" text-anchor="middle">4</text>
      <text x="116" y="115" font-family="monospace" font-size="7" fill="#2E2E42" text-anchor="middle">5</text>
      <text x="116" y="125" font-family="monospace" font-size="7" fill="#38384E" text-anchor="middle">6</text>
      <text x="116" y="135" font-family="monospace" font-size="7" fill="#38384E" text-anchor="middle">7</text>
      <text x="116" y="145" font-family="monospace" font-size="7" fill="#2E2E42" text-anchor="middle">8</text>
      <text x="116" y="155" font-family="monospace" font-size="7" fill="#2E2E42" text-anchor="middle">9</text>
      <text x="116" y="165" font-family="monospace" font-size="7" fill="#2E2E42" text-anchor="middle">10</text>
      <text x="116" y="175" font-family="monospace" font-size="7" fill="#2E2E42" text-anchor="middle">11</text>
      <text x="116" y="185" font-family="monospace" font-size="7" fill="#2E2E42" text-anchor="middle">12</text>
      <text x="116" y="195" font-family="monospace" font-size="7" fill="#2E2E42" text-anchor="middle">13</text>
      <text x="116" y="205" font-family="monospace" font-size="7" fill="#2E2E42" text-anchor="middle">14</text>

      <!-- Active line highlight -->
      <rect x="130" y="119" width="210" height="10" fill="#1A1A26" opacity="0.7" />

      <!-- Code syntax — C++ -->
      <text x="134" y="75" font-family="monospace" font-size="7.5" fill="#6C6C8E">#include &lt;iostream&gt;</text>
      <text x="134" y="85" font-family="monospace" font-size="7.5" fill="#6C6C8E">#include &lt;vector&gt;</text>

      <text x="134" y="97" font-family="monospace" font-size="7.5">
        <tspan fill="#A78BFA">class</tspan>
        <tspan fill="#E2E2E6"> Graph </tspan>
        <tspan fill="#D4D4D8">{</tspan>
      </text>
      <text x="134" y="107" font-family="monospace" font-size="7.5" fill="#6C6C8E">public:</text>

      <text x="142" y="118" font-family="monospace" font-size="7.5">
        <tspan fill="#60A5FA">int</tspan>
        <tspan fill="#E2E2E6"> solve(</tspan>
        <tspan fill="#60A5FA">int</tspan>
        <tspan fill="#E2E2E6"> n) {</tspan>
      </text>

      <!-- Active / highlighted line -->
      <text x="150" y="128" font-family="monospace" font-size="7.5">
        <tspan fill="#6C6C8E">// </tspan>
        <tspan fill="#4A4A6A">BFS traversal</tspan>
      </text>

      <text x="150" y="138" font-family="monospace" font-size="7.5">
        <tspan fill="#A78BFA">auto</tspan>
        <tspan fill="#E2E2E6"> q = </tspan>
        <tspan fill="#34D399">queue</tspan>
        <tspan fill="#E2E2E6">&lt;</tspan>
        <tspan fill="#60A5FA">int</tspan>
        <tspan fill="#E2E2E6">&gt;{};</tspan>
      </text>

      <text x="150" y="148" font-family="monospace" font-size="7.5" fill="#E2E2E6">q.push(src);</text>

      <text x="142" y="158" font-family="monospace" font-size="7.5" fill="#E2E2E6">}</text>
      <text x="134" y="168" font-family="monospace" font-size="7.5" fill="#E2E2E6">};</text>

      <!-- Cursor blink -->
      <rect x="183" y="161" width="1.5" height="9" fill="#DFB8AC" opacity="0.9" />

      <!-- Terminal strip at bottom -->
      <rect x="110" y="186" width="250" height="24" fill="#07070B" />
      <text x="130" y="195" font-family="monospace" font-size="6.5" fill="#22C55E">❯</text>
      <text x="139" y="195" font-family="monospace" font-size="6.5" fill="#6C6C8E">g++ -O2 main.cpp -o solution</text>
      <text x="130" y="205" font-family="monospace" font-size="6.5" fill="#34D399">✓ Compiled in 0.08s</text>
    </g>

    <!-- Laptop hinge shadow -->
    <rect x="102" y="212" width="286" height="4" fill="#07070A" opacity="0.8" />

    <!-- Laptop base -->
    <path d="M78 216 L102 214 L388 214 L412 216 L420 230 C420 232 418 234 415 234 L75 234 C72 234 70 232 70 230 Z" fill="#161620" stroke="#252535" stroke-width="1" />

    <!-- Keyboard detail -->
    <rect x="195" y="216" width="100" height="5" rx="2.5" fill="#202030" />

    <!-- Trackpad -->
    <rect x="225" y="223" width="40" height="6" rx="3" fill="#1A1A28" stroke="#252535" stroke-width="0.8" />
  </g>

  <!-- === RIGHT PANEL — Architecture diagram === -->
  <rect x="428" y="50" width="112" height="210" rx="10" fill="url(#panelGlow)" stroke="#1E1E30" stroke-width="1" />

  <!-- Panel header -->
  <text x="484" y="72" font-family="'SF Mono', 'Fira Code', monospace" font-size="7.5" fill="#6C6C8E" text-anchor="middle" letter-spacing="0.5">ARCHITECTURE</text>
  <line x1="438" y1="78" x2="530" y2="78" stroke="#1E1E32" stroke-width="0.8" />

  <!-- Stack nodes — vertical -->
  <!-- Frontend -->
  <rect x="449" y="88" width="70" height="22" rx="5" fill="#0F0F1C" stroke="#2A2A44" stroke-width="1" />
  <text x="484" y="103" font-family="monospace" font-size="7.5" fill="#60A5FA" text-anchor="middle">Frontend</text>

  <!-- Connector -->
  <line x1="484" y1="110" x2="484" y2="124" stroke="#252545" stroke-width="1" stroke-dasharray="2 2" />
  <circle cx="484" cy="117" r="2" fill="#2A2A44" />

  <!-- API Layer -->
  <rect x="449" y="124" width="70" height="22" rx="5" fill="#0F0F1C" stroke="#2A2A44" stroke-width="1" />
  <text x="484" y="139" font-family="monospace" font-size="7.5" fill="#A78BFA" text-anchor="middle">REST API</text>

  <!-- Connector -->
  <line x1="484" y1="146" x2="484" y2="160" stroke="#252545" stroke-width="1" stroke-dasharray="2 2" />
  <circle cx="484" cy="153" r="2" fill="#2A2A44" />

  <!-- Backend -->
  <rect x="449" y="160" width="70" height="22" rx="5" fill="#0F0F1C" stroke="#2A2A44" stroke-width="1" />
  <text x="484" y="175" font-family="monospace" font-size="7.5" fill="#34D399" text-anchor="middle">Backend</text>

  <!-- Connector -->
  <line x1="484" y1="182" x2="484" y2="196" stroke="#252545" stroke-width="1" stroke-dasharray="2 2" />
  <circle cx="484" cy="189" r="2" fill="#2A2A44" />

  <!-- Database -->
  <rect x="449" y="196" width="70" height="22" rx="5" fill="#0F0F1C" stroke="#2A2A44" stroke-width="1" />
  <text x="484" y="211" font-family="monospace" font-size="7.5" fill="#F59E0B" text-anchor="middle">Database</text>

  <!-- AI side branch from API -->
  <line x1="519" y1="135" x2="536" y2="135" stroke="#332C5E" stroke-width="1" stroke-dasharray="2 2" />
  <rect x="536" y="124" width="0" height="0" fill="none" />

  <!-- Panel divider -->
  <line x1="438" y1="228" x2="530" y2="228" stroke="#1E1E32" stroke-width="0.8" />

  <!-- DSA indicator -->
  <text x="484" y="242" font-family="monospace" font-size="6.5" fill="#4A4A6E" text-anchor="middle">DSA · C++</text>

  <!-- === BOTTOM DETAILS === -->

  <!-- Left item: notebook -->
  <rect x="38" y="258" width="52" height="68" rx="4" fill="#0D0D14" stroke="#1E1E2C" stroke-width="1" />
  <!-- Spine -->
  <rect x="38" y="258" width="6" height="68" rx="3" fill="#141420" stroke="#1E1E2C" stroke-width="0.5" />
  <!-- Note lines -->
  <line x1="50" y1="274" x2="82" y2="274" stroke="#DFB8AC" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
  <line x1="50" y1="283" x2="78" y2="283" stroke="#2E2E42" stroke-width="1" stroke-linecap="round" />
  <line x1="50" y1="292" x2="80" y2="292" stroke="#2E2E42" stroke-width="1" stroke-linecap="round" />
  <line x1="50" y1="301" x2="74" y2="301" stroke="#2E2E42" stroke-width="1" stroke-linecap="round" />
  <line x1="50" y1="310" x2="78" y2="310" stroke="#2A2A40" stroke-width="1" stroke-linecap="round" />
  <!-- Mini graph sketch in notebook -->
  <circle cx="58" cy="316" r="2.5" fill="none" stroke="#332C5E" stroke-width="1" />
  <circle cx="68" cy="316" r="2.5" fill="none" stroke="#332C5E" stroke-width="1" />
  <line x1="61" y1="316" x2="65" y2="316" stroke="#332C5E" stroke-width="0.8" />

  <!-- Right item: coffee / subtle accent cylinder -->
  <rect x="406" y="264" width="28" height="40" rx="6" fill="#0E0E18" stroke="#272740" stroke-width="1.2" />
  <!-- Cup handle -->
  <path d="M434 272 C442 272 442 290 434 290" stroke="#1E1E32" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Steam -->
  <path d="M414 260 C414 256 418 256 418 252" stroke="#DFB8AC" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.4" />
  <path d="M420 262 C420 258 424 258 424 254" stroke="#DFB8AC" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.3" />

  <!-- === BOTTOM STATUS BAR === -->
  <rect x="38" y="344" width="484" height="22" rx="6" fill="#0A0A10" stroke="#16161E" stroke-width="1" />
  <circle cx="54" cy="355" r="3" fill="#22C55E" opacity="0.8" />
  <text x="62" y="359" font-family="monospace" font-size="7" fill="#4A4A6E">portfolio — full-stack · dsa · systems</text>
  <text x="492" y="359" font-family="monospace" font-size="7" fill="#2E2E42" text-anchor="end">UTF-8</text>

  <!-- Subtle corner decoration — top right -->
  <line x1="508" y1="18" x2="542" y2="18" stroke="#1E1E2C" stroke-width="0.8" />
  <line x1="542" y1="18" x2="542" y2="8" stroke="#1E1E2C" stroke-width="0.8" />

  <!-- Subtle corner decoration — bottom left -->
  <line x1="18" y1="382" x2="52" y2="382" stroke="#1E1E2C" stroke-width="0.8" />
  <line x1="18" y1="382" x2="18" y2="372" stroke="#1E1E2C" stroke-width="0.8" />
</svg>
